[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-proxy"
version = "0.1.0"
description = "Unified, provenance-aware catalog for public proxy sources"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
system-proxy = "system_proxy.__main__:main"
system-proxy-check = "system_proxy.check_cli:main"
system-proxy-domain = "system_proxy.destination_cli:main"
system-proxy-select = "system_proxy.select:main"
system-proxy-gateway = "system_proxy.gateway:main"
system-proxy-gateway-stats = "system_proxy.gateway_history:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
