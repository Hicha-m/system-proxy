version: 1
jobs:
  test: {script: ci/test.sh, timeout: 45}
  build: {script: ci/build.sh, timeout: 45}
  campaign: {script: ci/campaign.sh, execution: persistent, timeout: 21600, network: true}
  daily: {script: ci/daily.sh, execution: persistent, timeout: 21600, network: true}
  d1-bootstrap: {script: ci/d1-bootstrap.sh, execution: persistent, timeout: 300, network: true}
  storage-status: {script: ci/storage-status.sh, execution: persistent, timeout: 60}
  rebuild-smoke: {script: ci/rebuild-smoke.sh, timeout: 45}
  daily-status: {script: ci/daily-status.sh, execution: persistent, timeout: 60}
  d1-preview: {script: ci/d1-preview.sh, execution: persistent, timeout: 300}
  d1-sync: {script: ci/codespace-d1-sync.sh, execution: persistent, timeout: 300, network: true}
  p2-benchmark: {script: ci/p2-benchmark.sh, timeout: 45}
  p2-observe: {script: ci/p2-observe.sh, execution: persistent, timeout: 60}
  p2-failures: {script: ci/p2-failure-diagnostics.sh, execution: persistent, timeout: 60}
  lot1-live: {script: ci/lot1-live.sh, execution: persistent, timeout: 180, network: true}
pipelines:
  quick: [test, build]
  p2: [test, build, p2-benchmark]
  p2-observe: [p2-observe]
  p2-failures: [p2-failures]
  lot1-live: [lot1-live]
  campaign: [campaign]
  daily: [daily]
  d1-bootstrap: [d1-bootstrap]
  storage-status: [storage-status]
  rebuild-smoke: [rebuild-smoke]
  daily-status: [daily-status]
  d1-preview: [d1-preview]
  d1-sync: [d1-sync]
