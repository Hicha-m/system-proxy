# Remote Dev MCP CI manifest — safe defaults.
# Network diagnostics are opt-in and never part of quick/full.
version: 1

jobs:
  test:
    script: ci/test.sh
    timeout: 45

  build:
    script: ci/build.sh
    timeout: 45

  network:
    script: ci/network.sh
    timeout: 45
    network: true

  campaign:
    script: ci/campaign.sh
    timeout: 900
    network: true

  campaign-report:
    script: ci/campaign-report.sh
    timeout: 60

pipelines:
  quick: [test, build]

  full: [test, build]

  live: [network]

  campaign: [campaign]

  campaign-report: [campaign-report]
