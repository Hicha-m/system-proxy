name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Offline unit tests through shared project CI entrypoint
        run: bash ci/test.sh
      - name: Offline build smoke (read-only source)
        run: bash ci/build.sh
      - name: Validate MCP script syntax (no network)
        run: bash -n ci/test.sh ci/build.sh ci/network.sh ci/campaign.sh ci/campaign-report.sh ci/daily.sh ci/daily-status.sh
      - name: CLI smoke tests (no network)
        run: |
          python -m system_proxy --list-sources
          system-proxy-select --help
          system-proxy-gateway --help
          system-proxy-gateway-stats --help
