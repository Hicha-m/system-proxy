name: Live network smoke test (opt-in branch only)

on:
  push:
    branches:
      - test/live-network-smoke-20261027

permissions:
  contents: read

jobs:
  real-network:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Execute bounded live test against example.com only
        run: python -u scripts/live_smoke.py
